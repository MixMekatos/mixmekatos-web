name: Hotfix Bot

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  hotfix:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PR_GHA_RELEASE_TK }}

      - name: Extract version
        id: version
        run: |
          BRANCH=${{ github.event.pull_request.head.ref }}
          VERSION=${BRANCH#hotfix/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "MixMekatos-Bot"
          git config user.email "tics@mixmekatos.com"

      - name: Create and push tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PR_GHA_RELEASE_TK }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }} (hotfix)" \
            --generate-notes \
            --latest

    
      - name: Back-merge main → develop
        id: backmerge
        env:
          GH_TOKEN: ${{ secrets.GH_PR_GHA_RELEASE_TK }}
        run: |
          git fetch --all

          if ! git ls-remote --exit-code --heads origin develop > /dev/null 2>&1; then
            echo "::warning::La rama develop no existe, se omite el back-merge"
            echo "merge_result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          BACKMERGE_BRANCH="bot/hotfix-back-merge-v${{ steps.version.outputs.version }}"

          # Crear rama temporal desde main como base para el PR
          git checkout -b $BACKMERGE_BRANCH origin/main

          # Intentar merge sin commit para detectar conflictos
          if git merge --no-commit --no-ff origin/develop; then
            if git diff --cached --quiet; then
              echo "develop ya estaba al día con main, no se necesita back-merge"
              echo "merge_result=noop" >> $GITHUB_OUTPUT
            else
              git commit -m "chore: back-merge hotfix v${{ steps.version.outputs.version }} main → develop [skip ci]"
              git push origin $BACKMERGE_BRANCH
              echo "merge_result=pr" >> $GITHUB_OUTPUT
            fi
          else
            git merge --abort
            git push origin $BACKMERGE_BRANCH
            echo "merge_result=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Create back-merge PR
        if: steps.backmerge.outputs.merge_result == 'pr' || steps.backmerge.outputs.merge_result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_GHA_RELEASE_TK }}
        run: |
          BACKMERGE_BRANCH="bot/hotfix-back-merge-v${{ steps.version.outputs.version }}"
          CONFLICT_NOTE=""
          TITLE="chore: back-merge hotfix v${{ steps.version.outputs.version }} → develop"

          if [ "${{ steps.backmerge.outputs.merge_result }}" = "conflict" ]; then
            CONFLICT_NOTE="\n> ⚠️ **Se detectaron conflictos.** Resuélvelos en la rama antes de mergear. Si no se mergea este PR, el bug corregido **volverá a aparecer** en el próximo release."
            TITLE="⚠️ Back-merge hotfix v${{ steps.version.outputs.version }} → develop (conflictos)"
          fi

          gh label create "hotfix" --color "e4e669" --description "Hotfix urgente en producción" --force
          gh label create "back-merge" --color "c5def5" --description "Requiere back-merge manual" --force

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "## Back-merge hotfix v${{ steps.version.outputs.version }} → \`develop\`

          PR generado automáticamente por el workflow **Hotfix Bot** para propagar el hotfix a \`develop\` y evitar que el bug vuelva en el próximo release.$CONFLICT_NOTE" \
            --base develop \
            --head $BACKMERGE_BRANCH \
            --label "hotfix,back-merge")

          echo "PR creado: $PR_URL"

          # Activar auto-merge (se mergea solo cuando pasen los checks)
          gh pr merge $PR_URL --auto --merge || echo "::notice::Auto-merge no disponible, aprueba el PR manualmente: $PR_URL"
